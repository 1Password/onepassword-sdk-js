name: Validate

on:
  push:
    paths-ignore:
      - '**.md'

permissions: {} # Default to no permissions

jobs:

  test:
    name: Test
    strategy:
      matrix:
        # Actively maintained versions at the time of writing (Sept 2026)
        # https://nodejs.org/en/about/previous-releases
        node-version: ['22', '24', '26']
    runs-on: shared-linux-amd64-large
    container:
      image: node:${{ matrix.node-version }}-bookworm
    permissions:
      contents: read # Required for Git checkout
      id-token: write # Required for OIDC auth to Cloudsmith
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Authenticate to Cloudsmith # Exports CLOUDSMITH_API_KEY
        uses: step-security/cloudsmith-cli-action@dd1da513017145043c2d29a38b3b85c2b609b5ad # v2.0.3
        with:
          oidc-auth-only: "true"
          oidc-namespace: "1password"
          oidc-service-slug: "ga-agilebits-inc-onepassword-sdk-js"

      - name: Install
        run: npm install

      - name: Test
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: npm test

      - name: Run esm-example
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.EXAMPLE_TESTS_OP_SERVICE_ACCOUNT_TOKEN }}
          OP_VAULT_ID: ${{ secrets.EXAMPLE_TESTS_OP_VAULT_ID }}
        run: |
          if [ -z "$OP_SERVICE_ACCOUNT_TOKEN" ] || [ -z "$OP_VAULT_ID" ]; then
            echo "::notice::Skipping ESM example because example-test credentials are unavailable."
            exit 0
          fi
          npm run esm-example

  lint:
    name: Lint
    runs-on: shared-linux-amd64-large
    container:
      image: node:24-bookworm
    permissions:
      contents: read # Required for Git checkout
      id-token: write # Required for OIDC auth to Cloudsmith
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Authenticate to Cloudsmith # Exports CLOUDSMITH_API_KEY
        uses: step-security/cloudsmith-cli-action@dd1da513017145043c2d29a38b3b85c2b609b5ad # v2.0.3
        with:
          oidc-auth-only: "true"
          oidc-namespace: "1password"
          oidc-service-slug: "ga-agilebits-inc-onepassword-sdk-js"

      - name: Install
        run: npm install

      - name: Style
        run: npm run prettier

      - name: Lint
        run: npm run eslint
